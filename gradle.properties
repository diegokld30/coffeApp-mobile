## ─────────────────────────────────────────────────────────────────────────────
## AgroVisión — configuración de compilación
## ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
ksp.incremental=true

## ─────────────────────────────────────────────────────────────────────────────
## ⚠️ CONTRATO DE IDENTIDAD PLAY STORE (§2.1) — VALOR CONFIRMADO
##
## `applicationId` es un INVARIANTE ABSOLUTO. Cambiarlo no actualiza la app:
## publica una distinta y deja a los usuarios actuales sin ruta de actualización.
##
## El valor viene de la app publicada (Ionic + Capacitor), confirmado por el
## equipo el 2026-08-11. Está en dos sitios del proyecto anterior:
##   coffee-check-app-main/capacitor.config.ts        → appId
##   coffee-check-app-main/android/app/build.gradle   → applicationId
##
## Sí, es el identificador por defecto de la plantilla de Ionic. Da igual: es el
## que está publicado, y por tanto es el correcto. NO SE TOCA.
##
## El paquete Kotlin (`namespace = co.agrovision`) es independiente y
## sí refleja la organización real. Android permite que difieran; aprovecharlo
## aquí es lo que deja el código limpio sin romper la continuidad en Play.
## ─────────────────────────────────────────────────────────────────────────────
agrovision.applicationId=io.ionic.starter

## versionName SemVer del refactor. Arranca en 2.0.0: la publicada es 1.0.1 y
## esto es una reescritura completa de la plataforma, no una corrección.
agrovision.versionName=2.0.0

## versionCode.
##
## ⚠️ El AAB publicado declara versionCode=2, NO 1. El repositorio de Ionic
## decía 1 porque estaba desactualizado respecto a lo que se subió a Play.
## Verificado con: aapt2 dump badging app-release.apk
##
## Por eso 3 es el mínimo. Y sigue pendiente confirmar en Play Console que
## nadie subió un 3 o un 4 a una pista interna o cerrada: un versionCode que
## Play haya visto alguna vez queda quemado para siempre, aunque esa versión
## se haya despublicado.
agrovision.versionCode=3

## Endpoints. Sin barra final. Se inyectan como BuildConfig del módulo :app.
agrovision.api.baseUrl=https://api.smartclic.co/
## Depuración: backend local (agrovision-api) visto desde el emulador. Con barra
## final, porque Retrofit resuelve las rutas relativas contra ella y el backend
## cuelga todo de `/api`. En un teléfono físico, sobrescríbelo con la IP del
## equipo: ./gradlew installDebug -Pagrovision.api.baseUrlDebug=http://192.168.x.x:3000/api/
agrovision.api.baseUrlDebug=http://10.0.2.2:3000/api/
agrovision.cdn.baseUrl=https://cdn.smartclic.co/

## Clave pública Ed25519 de firma de modelos, en Base64 crudo (32 bytes).
## Se embebe en el binario y la protege R8 (§15.4). La privada NUNCA entra aquí:
## vive en la estación de ML o en un HSM (§15.6).
## Genera el par con: scripts/generate-signing-keys.sh
agrovision.model.signingPublicKeyBase64=Hax+3pXLIVedKf+X+MPza50KJjizC4dWM/M5nKcunzw=

## Anclaje de certificado (§15.4). Pines SPKI SHA-256 separados por coma.
## OBLIGATORIO incluir un pin de respaldo: un solo pin convierte la rotación
## del certificado en un apagón total de la flota instalada.
agrovision.pinning.apiHost=api.smartclic.co
agrovision.pinning.cdnHost=cdn.smartclic.co
agrovision.pinning.pins=TODO_SHA256_PIN_PRIMARIO,TODO_SHA256_PIN_RESPALDO

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
